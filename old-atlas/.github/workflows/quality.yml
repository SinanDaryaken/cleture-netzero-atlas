name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy atlas apps sources
      - run: uv run pytest

  live-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build api
      - run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:48080/health && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:48080/health
      - run: |
          response=$(curl --fail --silent --request POST \
            --header 'X-Atlas-Actor: github-actions' \
            http://127.0.0.1:48080/v1/explorer/regression/run)
          python -c 'import json,sys; result=json.load(sys.stdin); assert result["total"] == result["passed"] == 68 and result["failed"] == 0 and result["changed"] == 0' <<<"$response"
      - if: always()
        run: docker compose logs --no-color api migrate recommendation-index
