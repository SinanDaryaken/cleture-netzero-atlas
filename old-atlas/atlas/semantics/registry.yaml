version: "1.2.2"
target_languages: [en, tr, de, fr, es, ru, ar]
context_defaults:
  corporate_carbon: corporate_carbon.ghg_protocol.scope1
  lca: lca.iso14040
  pcf: pcf.iso14067
  cbam: cbam.eu_definitive
  freight: freight.glec
profiles:
  - code: corporate_carbon.ghg_protocol.scope1
    context: corporate_carbon
    allowed_entity_types: [emission_factor, implied_emission_factor]
    allowed_factor_value_kinds: [co2e_total]
    allowed_intended_uses: [inventory]
    allowed_scopes: [scope 1]
    allow_conditional_conversion: true
  - code: corporate_carbon.ghg_protocol.scope2_location
    context: corporate_carbon
    allowed_entity_types: [emission_factor, implied_emission_factor]
    allowed_factor_value_kinds: [co2e_total]
    allowed_intended_uses: [inventory]
    allowed_scopes: [scope 2]
    allow_conditional_conversion: false
  - code: corporate_carbon.ghg_protocol.scope3
    context: corporate_carbon
    allowed_entity_types: [emission_factor, implied_emission_factor]
    allowed_factor_value_kinds: [co2e_total]
    allowed_intended_uses: [inventory]
    allowed_scopes: [scope 3]
    allow_conditional_conversion: true
  - code: lca.iso14040
    context: lca
    allowed_entity_types: [lca_result, characterization_result, epd]
    allowed_factor_value_kinds: [co2e_total, characterization_factor]
    allowed_intended_uses: [characterization, calculation_input]
    allow_conditional_conversion: false
  - code: pcf.iso14067
    context: pcf
    allowed_entity_types: [lca_result, characterization_result, epd]
    allowed_factor_value_kinds: [co2e_total, characterization_factor]
    allowed_intended_uses: [characterization, calculation_input]
    allow_conditional_conversion: false
  - code: cbam.eu_definitive
    context: cbam
    allowed_entity_types: [embodied_emission_factor]
    allowed_factor_value_kinds: [co2e_total]
    allowed_intended_uses: [calculation_input]
    allow_conditional_conversion: false
  - code: freight.glec
    context: freight
    allowed_entity_types: [emission_factor, implied_emission_factor]
    allowed_factor_value_kinds: [co2e_total]
    allowed_intended_uses: [inventory]
    allow_conditional_conversion: true
